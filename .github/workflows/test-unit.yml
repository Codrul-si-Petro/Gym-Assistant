name: unit-tests

on: 
  pull_request:
    branches: [main, dev]
    paths:
        - 'backend/**'
        - 'tests/unit/**'
        - 'tests/e2e/**'
        - 'tests/meta/**'
        - 'scripts/**'
  push:
    branches: [main, dev]
    paths:
        - 'backend/**'
        - 'tests/unit/**'
        - 'tests/e2e/**'
        - 'tests/meta/**'
        - 'scripts/**'

jobs: 
  auth-tests:
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install dependencies
        run: uv sync
      
      - name: Run tests
        run: uv run pytest tests/unit/ tests/meta/ -v
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: "*"
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          MAILERSEND_API_TOKEN: ${{ secrets.MAILERSEND_API_TOKEN }}
          MAILERSEND_FROM_EMAIL: ${{ secrets.MAILERSEND_FROM_EMAIL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          UI_TESTER_USERNAME: ${{ secrets.UI_TESTER_USERNAME }}
          UI_TESTER_PASS: ${{ secrets.UI_TESTER_PASS }}

      - name: Check API endpoint unit-test coverage
        run: uv run python scripts/check_endpoint_coverage.py

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK not set; skipping notification"
            exit 0
          fi
          python3 -c 'import json,os,urllib.request; c=f"❌ **{os.environ[\"GITHUB_WORKFLOW\"]}** failed on `{os.environ[\"GITHUB_REF_NAME\"]}`\n{os.environ[\"GITHUB_SERVER_URL\"]}/{os.environ[\"GITHUB_REPOSITORY\"]}/actions/runs/{os.environ[\"GITHUB_RUN_ID\"]}"; urllib.request.urlopen(urllib.request.Request(os.environ["DISCORD_WEBHOOK"], data=json.dumps({"content":c}).encode(), headers={"Content-Type":"application/json"}, method="POST"))'
