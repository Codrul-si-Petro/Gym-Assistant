name: E2E Tests

on:
  pull_request:
    branches: [main]
    paths:
        - 'frontend/**'
        - 'backend/**'
        - 'tests/e2e/**'
  push:
    branches: [main]
    paths:
        - 'frontend/**'
        - 'backend/**'
        - 'tests/e2e/**'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    environment: dev  # Use Dev environment for secrets
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install dependencies
        run: uv sync
      
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
      
      - name: Run E2E tests
        run: uv run pytest tests/e2e/ -v --tb=short
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UI_TESTER_USERNAME: ${{ secrets.UI_TESTER_USERNAME }}
          UI_TESTER_PASS: ${{ secrets.UI_TESTER_PASS }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: "True"
          MAILERSEND_API_TOKEN: ${{ secrets.MAILERSEND_API_TOKEN }}
          MAILERSEND_FROM_EMAIL: ${{ secrets.MAILERSEND_FROM_EMAIL }}
          DJANGO_ALLOWED_HOSTS: "*"
          # E2E boots local servers in tests/conftest.py — must not point at deployed URLs.
          FRONTEND_URL: http://127.0.0.1:5500
          BACKEND_URL: http://127.0.0.1:8000
          E2E_SERVER_TIMEOUT: "90"

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK not set; skipping notification"
            exit 0
          fi

          python3 <<'PY'
          import json
          import os
          import urllib.request

          content = (
              f"**{os.environ['GITHUB_WORKFLOW']}** failed on "
              f"`{os.environ['GITHUB_REF_NAME']}`\n"
              f"{os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              data=json.dumps({"content": content}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=10) as response:
              print(f"Discord notification sent: HTTP {response.status}")
          PY
