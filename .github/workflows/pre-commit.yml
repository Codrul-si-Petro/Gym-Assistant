name: Pre-commit

on:
  pull_request:
    branches: [main, dev]
    paths:
        - 'backend/**'
        - 'tests/e2e/**'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit
        run: uv run pre-commit run --all-files
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: "*"
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DBT_HOST: ${{ secrets.DBT_HOST }}
          DBT_USER: ${{ secrets.DBT_USER }}
          DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
          DBT_DBNAME: ${{ secrets.DBT_DBNAME }}

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK not set; skipping notification"
            exit 0
          fi

          python3 <<'PY'
          import json
          import os
          import urllib.request

          content = (
              f"**{os.environ['GITHUB_WORKFLOW']}** failed on "
              f"`{os.environ['GITHUB_REF_NAME']}`\n"
              f"{os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              data=json.dumps({"content": content}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=10) as response:
              print(f"Discord notification sent: HTTP {response.status}")
          PY
