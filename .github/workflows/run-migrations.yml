name: 🛠️ Run Database Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run migrations in"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [main]
    paths:
      - "backend/**/migrations/**"
      - "db/alembic/versions/**"
      - "db/core/**"
      - ".github/workflows/run-migrations.yml"

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_NO_POOLER: ${{ secrets.DATABASE_URL_NO_POOLER }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      MAILERSEND_API_TOKEN: ${{ secrets.MAILERSEND_API_TOKEN }}
      MAILERSEND_FROM_EMAIL: ${{ secrets.MAILERSEND_FROM_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Show Django migration status
        run: uv run python manage.py showmigrations

      - name: Check Django migration drift
        run: |
          if ! uv run python manage.py migrate --check; then
            echo "::warning::Pending Django migrations detected — applying next."
          fi

      - name: Show Alembic migration status
        run: |
          echo "=== Current Alembic revision ==="
          uv run alembic current
          echo ""
          echo "=== Alembic history ==="
          uv run alembic history
        working-directory: ./db

      - name: Check Alembic migration drift
        run: |
          current=$(uv run alembic current 2>/dev/null | awk 'NF {print $1; exit}')
          head=$(uv run alembic heads | awk 'NF {print $1; exit}')
          echo "Alembic current=$current head=$head"
          if [ -n "$current" ] && [ -n "$head" ] && [ "$current" != "$head" ]; then
            echo "::warning::Pending Alembic migrations detected — upgrading next."
          fi
        working-directory: ./db

      - name: Run Django migrations
        run: uv run python manage.py migrate --no-input

      - name: Run Alembic migrations
        run: uv run alembic upgrade head
        working-directory: ./db

      - name: Show final migration status
        run: |
          echo "=== Django migrations after apply ==="
          uv run python manage.py showmigrations
          echo ""
          echo "=== Alembic revision after apply ==="
          cd db && uv run alembic current
