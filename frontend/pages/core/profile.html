<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="../../css/general-components/theme.css?v=7">
    <link rel="stylesheet" href="../../css/general-components/profile-menu.css?v=2">
    <link rel="stylesheet" href="../../css/general-components/navigation.css?v=2">
    <link rel="stylesheet" href="../../css/core/profile.css?v=2">
    <link rel="stylesheet" href="../../css/general-components/info-popover.css?v=1">
    <link rel="icon" href="../../assets/favicon.ico" sizes="any">
</head>
<body data-info-page="profile">
    <div class="nav">
        <button class="nav-toggle" aria-label="Toggle Menu" type="button">
          <svg class="nav-toggle-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" class="theme-toggle nav-theme-toggle" aria-label="Switch theme">☀</button>
        <span class="site-title">Gym Assistant</span>
        <div class="nav-links">
            <a href="../../index.html">Home</a>
            <a href="workouts_input.html">Log workouts</a>
            <a href="workouts_plan.html">Plan workouts</a>
            <a href="workouts_table.html">Workout history</a>
            <a href="dashboard.html">Metrics</a>
            <a href="explore.html">Glossary</a>
        </div>
        <div id="nav-actions" class="nav-actions">
        </div>
    </div>

    <main class="profile-page">
        <section class="profile-card card reveal">
            <h1>Your profile</h1>
            <p id="profile-msg" class="profile-msg" role="alert" aria-live="polite"></p>
            <dl class="profile-details">
                <div><dt>Username</dt><dd id="profile-username">—</dd></div>
                <div><dt>Email</dt><dd id="profile-email">—</dd></div>
            </dl>
            <form id="preferences-form" class="profile-form">
                <label for="preferred-unit">Preferred unit for charts and summaries</label>
                <select id="preferred-unit" name="preferred_unit">
                    <option value="KG">KG</option>
                    <option value="LBS">LBS</option>
                </select>
                <button type="submit" class="cta-button">Save preference</button>
            </form>
            <div class="profile-actions">
                <a href="account.html" class="cta-button">Account settings</a>
                <a href="explore.html" class="cta-button cta-button--ghost">Glossary</a>
                <a id="profile-support" href="#" class="cta-button cta-button--ghost">Contact support</a>
            </div>
        </section>
    </main>

    <script type="module" src="../../js/general-components/theme.js?v=2"></script>
    <script type="module" src="../../js/general-components/profile-menu.js?v=2"></script>
    <script type="module" src="../../js/general-components/info-popover.js?v=1"></script>
    <script type="module" src="../../js/general-components/animations.js?v=2"></script>
    <script src="../../js/auth/require-auth.js?v=2"></script>
    <script src="../../js/general-components/navigation.js?v=2"></script>
    <script type="module" src="../../js/core/profile.js?v=2"></script>
</body>
</html>
