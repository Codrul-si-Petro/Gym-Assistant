<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Workout</title>
    <link rel="stylesheet" href="../../css/general-components/theme.css?v=7">
    <link rel="stylesheet" href="../../css/general-components/profile-menu.css?v=2">
    <link rel="stylesheet" href="../../css/core/workouts_input.css?v=8">
    <link rel="stylesheet" href="../../css/general-components/info-popover.css?v=1">
    <link rel="stylesheet" href="../../css/general-components/navigation.css?v=2">
    <link rel="icon" href="../../assets/favicon.ico" sizes="any">
</head>
<body data-info-page="plan">
    <div class="nav">
      <button class="nav-toggle" aria-label="Toggle Menu" type="button">
        <svg class="nav-toggle-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <button type="button" class="theme-toggle nav-theme-toggle" aria-label="Switch theme">☀</button>
      <span class="site-title">Gym Assistant</span>
      <div class="nav-links">
          <a href="../../index.html">Home</a>
          <a href="workouts_input.html">Log workouts</a>
          <a href="workouts_table.html">Workout history</a>
          <a href="dashboard.html">Metrics</a>
          <a href="explore.html">Glossary</a>
      </div>
      <div id="nav-actions" class="nav-actions"></div>
    </div>

    <main class="workout-input workout-plan">
        <h1>Plan workout</h1>
        <p class="plan-lead">Build one template set, then stamp it onto multiple future dates. Plans appear in Metrics as a forecast line.</p>
        <div id="message" class="message" role="alert" aria-live="polite"></div>

        <form id="workout-plan-form">
            <div class="field plan-dates-field">
                <label for="plan_date_picker">Plan dates</label>
                <div class="plan-dates-row">
                    <input type="date" id="plan_date_picker">
                    <button type="button" id="plan_date_add" class="plan-date-add">Add date</button>
                </div>
                <ul id="plan_dates_list" class="plan-dates-list" aria-live="polite"></ul>
            </div>

            <div class="field">
                <label for="workout_split">Split</label>
                <input type="text" id="workout_split" name="workout_split" maxlength="50" placeholder="e.g. Push">
            </div>

            <div class="field">
                <label for="exercise_name">Exercise name *</label>
                <input type="text" id="exercise_name" name="exercise_name" list="exercises_list" required autocomplete="off">
                <datalist id="exercises_list"></datalist>
            </div>
            <div class="field">
                <label for="attachment_name">Attachment</label>
                <input type="text" id="attachment_name" name="attachment_name" list="attachments_list" placeholder="None" autocomplete="off">
                <datalist id="attachments_list"></datalist>
            </div>
            <div class="field">
                <label for="equipment_name">Equipment</label>
                <input type="text" id="equipment_name" name="equipment_name" list="equipment_list" placeholder="None" autocomplete="off">
                <datalist id="equipment_list"></datalist>
            </div>

            <div class="form-row form-set-metrics">
                <div class="field">
                    <label for="repetitions">Reps</label>
                    <input type="number" id="repetitions" name="repetitions" min="1" max="1000" value="8" required>
                </div>
                <div class="field">
                    <label for="load">Load</label>
                    <input type="number" id="load" name="load" min="0" step="any" value="0" required>
                </div>
                <div class="field">
                    <label for="unit">Unit</label>
                    <select id="unit" name="unit">
                        <option value="KG" selected>KG</option>
                        <option value="LBS">LBS</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label for="set_type">Set type</label>
                <input type="text" id="set_type" name="set_type" value="Working set" placeholder="Working set">
            </div>
            <div class="field">
                <label for="comments">Comments</label>
                <textarea id="comments" name="comments" rows="2" placeholder="Optional"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" id="submit-btn">Save plan</button>
            </div>
        </form>
    </main>

    <script type="module" src="../../js/general-components/theme.js?v=2"></script>
    <script type="module" src="../../js/general-components/profile-menu.js?v=2"></script>
    <script type="module" src="../../js/general-components/info-popover.js?v=2"></script>
    <script src="../../js/auth/require-auth.js?v=2"></script>
    <script src="../../js/core/workouts_plan.js?v=1"></script>
    <script src="../../js/general-components/navigation.js?v=2"></script>
</body>
</html>
