<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <link rel="stylesheet" href="../../css/general-components/theme.css?v=7">
    <link rel="stylesheet" href="../../css/general-components/profile-menu.css?v=2">
    <link rel="stylesheet" href="../../css/general-components/navigation.css?v=2">
    <link rel="stylesheet" href="../../css/core/account.css?v=2">
    <link rel="stylesheet" href="../../css/general-components/info-popover.css?v=1">
    <link rel="icon" href="../../assets/favicon.ico" sizes="any">
</head>
<body data-info-page="account">
    <div class="nav">
        <button class="nav-toggle" aria-label="Toggle Menu" type="button">
          <svg class="nav-toggle-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" class="theme-toggle nav-theme-toggle" aria-label="Switch theme">☀</button>
        <span class="site-title">Gym Assistant</span>
        <div class="nav-links">
            <a href="../../index.html">Home</a>
            <a href="workouts_input.html">Log workouts</a>
            <a href="workouts_table.html">Workout history</a>
            <a href="dashboard.html">Metrics</a>
            <a href="explore.html">Glossary</a>
        </div>
        <div id="nav-actions" class="nav-actions">
        </div>
    </div>

    <main class="account-page">
        <h1>Account settings</h1>
        <p id="account-msg" class="account-msg" role="alert" aria-live="polite"></p>

        <section class="account-card card">
            <h2>Change username</h2>
            <form id="username-form" class="account-form">
                <label for="new-username">New username</label>
                <input type="text" id="new-username" name="username" minlength="3" maxlength="150" required autocomplete="username">
                <button type="submit" class="cta-button">Update username</button>
            </form>
        </section>

        <section class="account-card card">
            <h2>Change password</h2>
            <form id="password-form" class="account-form">
                <label for="current-password">Current password</label>
                <input type="password" id="current-password" name="current_password" required autocomplete="current-password">
                <label for="new-password1">New password</label>
                <input type="password" id="new-password1" name="new_password1" minlength="8" required autocomplete="new-password">
                <label for="new-password2">Confirm new password</label>
                <input type="password" id="new-password2" name="new_password2" minlength="8" required autocomplete="new-password">
                <button type="submit" class="cta-button">Update password</button>
            </form>
        </section>
    </main>

    <script type="module" src="../../js/general-components/theme.js?v=2"></script>
    <script type="module" src="../../js/general-components/profile-menu.js?v=2"></script>
    <script type="module" src="../../js/general-components/info-popover.js?v=2"></script>
    <script src="../../js/auth/require-auth.js?v=2"></script>
    <script src="../../js/general-components/navigation.js?v=2"></script>
    <script type="module" src="../../js/core/account.js?v=2"></script>
</body>
</html>
