<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout History</title>
    <link rel="stylesheet" href="../../css/general-components/theme.css?v=11">
    <link rel="stylesheet" href="../../css/general-components/profile-menu.css?v=2">
    <link rel="stylesheet" href="../../css/general-components/split-onboarding.css?v=3">
    <link rel="stylesheet" href="../../css/general-components/data-surface.css?v=2">
    <link rel="stylesheet" href="../../css/general-components/edit-sheet.css?v=1">
    <link rel="stylesheet" href="../../css/general-components/info-popover.css?v=1">
    <link rel="stylesheet" href="../../css/core/workouts_table.css?v=4">
    <link rel="stylesheet" href="../../css/general-components/navigation.css?v=2">
    <link rel="icon" href="../../assets/favicon.ico" sizes="any">
</head>
<body data-info-page="history">
    <div class="nav">
      <button class="nav-toggle" aria-label="Toggle Menu" type="button">
        <svg class="nav-toggle-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <button type="button" class="theme-toggle nav-theme-toggle" aria-label="Switch theme">☀</button>
      <span class="site-title">Gym Assistant</span>
      <div class="nav-links">
          <a href="../../index.html">Home</a>
          <a href="today.html">Today</a>
          <a href="workouts_input.html">Log workouts</a>
          <a href="workouts_plan.html">Plan workouts</a>
          <a href="workouts_table.html">Workout history</a>
          <a href="dashboard.html">Metrics</a>
          <a href="explore.html">Glossary</a>
      </div>
      <div id="nav-actions" class="nav-actions">
      </div>
    </div>

    <header class="history-header">
      <div class="history-heading">
        <h1>Workout History</h1>
      </div>
      <button type="button" id="filters-toggle" class="filters-toggle" aria-expanded="false" aria-controls="filters-panel">
        Filters
        <span id="filters-badge" class="filters-badge" hidden>0</span>
      </button>
    </header>

    <div id="filters-panel" class="filters-panel" hidden>
      <div class="filters-panel-head">
        <span class="filters-panel-title">Filter sets</span>
      </div>
      <div class="filters-grid">
        <div class="field">
          <label for="filter-scenario">Scenario</label>
          <select id="filter-scenario">
            <option value="actuals" selected>Actuals</option>
            <option value="plan">Plan</option>
            <option value="all">All</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-exercise">Exercise</label>
          <select id="filter-exercise">
            <option value="">Any</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-split">Workout split</label>
          <select id="filter-split">
            <option value="">Any</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-set-type">Set type</label>
          <select id="filter-set-type">
            <option value="">Any</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-workout-number">Workout #</label>
          <input type="number" id="filter-workout-number" min="1" placeholder="Any">
        </div>
        <div class="field">
          <label for="filter-start-date">From</label>
          <input type="date" id="filter-start-date">
        </div>
        <div class="field">
          <label for="filter-end-date">To</label>
          <input type="date" id="filter-end-date">
        </div>
      </div>
      <div class="filters-actions">
        <button type="button" id="filters-apply" class="filters-apply">Apply</button>
        <button type="button" id="filters-clear" class="filters-clear">Clear</button>
      </div>
    </div>

    <div id="auth-msg" class="auth-msg"></div>
    <div class="data-surface table-wrap">
        <table class="data-table history-table">
            <thead>
                <tr>
                    <th>Workout #</th>
                    <th>Date</th>
                    <th>Exercise</th>
                    <th>Set</th>
                    <th>Reps</th>
                    <th>Load</th>
                    <th>Equipment</th>
                    <th>Attachment</th>
                    <th>Unit</th>
                    <th>Type</th>
                    <th>Comments</th>
                    <th>Split</th>
                    <th class="edit-col-header"><span class="sr-only">Edit</span></th>
                </tr>
            </thead>
            <tbody id="workout-tbody">
                <tr><td colspan="13" class="empty-msg">Loading…</td></tr>
            </tbody>
        </table>
    </div>
    <div class="workouts-pagination">
      <p id="workouts-count" class="workouts-count" aria-live="polite"></p>
      <button type="button" id="load-more-btn" class="load-more-btn" hidden>Load more</button>
    </div>
    <p id="loading-row" class="loading-row" hidden>Loading more workouts…</p>
    <script type="module" src="../../js/general-components/theme.js?v=2"></script>
    <script type="module" src="../../js/general-components/profile-menu.js?v=4"></script>
    <script type="module" src="../../js/general-components/info-popover.js?v=7"></script>
    <script src="../../js/api-base.js?v=2"></script>
    <script src="../../js/auth/require-auth.js?v=3"></script>
    <script type="module" src="../../js/general-components/split-onboarding.js?v=3"></script>
    <script src="../../js/general-components/edit-sheet.js?v=1"></script>
    <script src="../../js/core/dimension-picker.js?v=5"></script>
    <script src="../../js/core/workouts_table.js?v=6"></script>
    <script type="module" src="../../js/general-components/navigation.js?v=3"></script>
</body>
</html>
