<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password</title>
  <link rel="stylesheet" href="../../css/general-components/theme.css">
  <link rel="stylesheet" href="../../css/auth/login.css">
</head>
<body>
<div class="login-container">
  <h1>Reset password</h1>
  <p class="auth-subtext">Enter your email and we'll send you a reset link.</p>
  <div id="error" class="error"></div>
  <div id="success" class="success"></div>
  <form id="resetRequestForm">
    <input type="email" id="email" placeholder="Email address" required autocomplete="email">
    <button type="submit">Send reset link</button>
  </form>
  <p><a href="login.html">Back to login</a></p>
</div>
<script type="module" src="../../js/general-components/theme.js"></script>
<script type="module" src="../../js/auth/password-reset.js"></script>
</body>
</html>
