<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set new password</title>
  <link rel="stylesheet" href="../../css/general-components/theme.css?v=11">
  <link rel="stylesheet" href="../../css/auth/login.css">
</head>
<body>
<div class="login-container">
  <h1>Set new password</h1>
  <div id="error" class="error"></div>
  <form id="resetConfirmForm">
    <input type="password" id="password1" placeholder="New password" required minlength="8" autocomplete="new-password">
    <input type="password" id="password2" placeholder="Confirm new password" required minlength="8" autocomplete="new-password">
    <button type="submit">Update password</button>
  </form>
  <p><a href="password_reset_request.html">Request a new link</a></p>
</div>
<script type="module" src="../../js/general-components/theme.js"></script>
<script type="module" src="../../js/auth/password-reset.js"></script>
</body>
</html>
