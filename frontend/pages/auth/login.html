<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="../../css/general-components/theme.css">
  <link rel="stylesheet" href="../../css/auth/login.css">
</head>
<body>

<div class="login-container">
  <h1>Log in</h1>
  <div id="error" class="error"></div>
  <form id="loginForm">
    <input type="text" id="username" placeholder="Username or Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Log in</button>
  </form>
  <p><a href="password_reset_request.html">Forgot password?</a></p>
  <p>Or continue with:</p>
  <a href="#" id="googleLogin" class="social-button">Log in with Google</a>
  <p>Don't have an account? <a href="signup.html">Sign up</a></p>
</div>

<script src="../../js/auth/store-jwt.js"></script>
<script type="module" src="../../js/general-components/theme.js"></script>
<script src="../../js/auth/login.js"></script>
</body>
</html>
